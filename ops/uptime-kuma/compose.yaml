# Uptime Kuma on its own LXC (uptime-01), outside the Airflow VM, so it can
# still alert when the VM itself is down. Deployed manually (docs/setup-vm.md).
name: uptime-kuma

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    volumes:
      - kuma-data:/app/data
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/api/entry-page > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  kuma-data:
