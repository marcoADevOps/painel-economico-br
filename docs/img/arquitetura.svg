<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .h { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 13px; fill: #334155; }
      .s { font-size: 12px; fill: #64748b; }
      .edge { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .alert { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow-red); }
      .ops { stroke: #475569; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="40" y="48" class="title">Painel Econômico BR: arquitetura</text>
  <text x="40" y="74" class="s">Airflow 3 · Postgres 16 · Metabase · Docker Compose numa VM Proxmox · CI/CD com GitHub Actions (runner self-hosted)</text>

  <!-- Sources -->
  <rect x="40" y="110" width="220" height="330" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="140" class="h">Fontes públicas</text>
  <rect x="60" y="160" width="180" height="76" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="74" y="186" class="h">Banco Central</text>
  <text x="74" y="206" class="t">API SGS (JSON)</text>
  <text x="74" y="224" class="s">Selic meta, PTAX</text>
  <rect x="60" y="248" width="180" height="76" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="74" y="274" class="h">IBGE</text>
  <text x="74" y="294" class="t">API SIDRA (JSON)</text>
  <text x="74" y="312" class="s">IPCA por região, desocupação</text>
  <rect x="60" y="336" width="180" height="88" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="74" y="362" class="h">ANP</text>
  <text x="74" y="382" class="t">CSVs em gov.br</text>
  <text x="74" y="400" class="s">preço por posto (2016+),</text>
  <text x="74" y="416" class="s">links descobertos na página</text>

  <!-- VM -->
  <rect x="300" y="100" width="760" height="560" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="130" class="h">VM airflow-01 (Ubuntu 24.04 · 2 vCPU · 4 GB · Docker Compose)</text>

  <!-- Airflow -->
  <rect x="320" y="150" width="380" height="300" rx="10" fill="#fff" stroke="#60a5fa"/>
  <text x="336" y="176" class="h">Apache Airflow 3 (LocalExecutor)</text>
  <text x="336" y="196" class="s">api-server · scheduler · dag-processor</text>
  <rect x="336" y="210" width="165" height="30" rx="6" fill="#dbeafe"/><text x="348" y="230" class="t">bcb_sgs · dias úteis 19h</text>
  <rect x="336" y="246" width="165" height="30" rx="6" fill="#dbeafe"/><text x="348" y="266" class="t">ibge_sidra · dias úteis 10h</text>
  <rect x="336" y="282" width="165" height="30" rx="6" fill="#dbeafe"/><text x="348" y="302" class="t">anp_precos · segundas 11h</text>
  <text x="516" y="230" class="s">extract → raw</text>
  <text x="516" y="248" class="s">→ staging</text>
  <text x="516" y="266" class="s">→ quality_checks</text>
  <text x="516" y="284" class="s">→ publish (Asset)</text>
  <rect x="336" y="330" width="350" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="348" y="350" class="t">Asset: staging atualizada (condição OU)</text>
  <text x="348" y="366" class="s">dado ruim falha na qualidade e não chega aos marts</text>
  <rect x="336" y="390" width="350" height="44" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="348" y="410" class="t">marts · reconstrução em uma transação</text>
  <text x="348" y="426" class="s">indicadores, IPCA, desocupação, combustíveis</text>
  <path d="M511 374 L511 390" class="edge"/>

  <!-- Postgres -->
  <rect x="720" y="150" width="320" height="200" rx="10" fill="#fff" stroke="#60a5fa"/>
  <text x="736" y="176" class="h">PostgreSQL 16</text>
  <text x="736" y="200" class="t">painel (warehouse)</text>
  <rect x="736" y="210" width="90" height="28" rx="6" fill="#e2e8f0"/><text x="762" y="229" class="t">raw</text>
  <rect x="834" y="210" width="90" height="28" rx="6" fill="#e2e8f0"/><text x="850" y="229" class="t">staging</text>
  <rect x="932" y="210" width="90" height="28" rx="6" fill="#dcfce7"/><text x="956" y="229" class="t">marts</text>
  <path d="M826 224 L834 224" class="edge"/><path d="M924 224 L932 224" class="edge"/>
  <text x="736" y="266" class="t">airflow (metadados)</text>
  <text x="736" y="288" class="t">metabase (configuração)</text>
  <text x="736" y="316" class="s">metabase_ro: só leitura em marts</text>
  <text x="736" y="334" class="s">upsert por chave natural (idempotente)</text>

  <!-- Raw files -->
  <rect x="720" y="366" width="320" height="84" rx="10" fill="#fff" stroke="#60a5fa"/>
  <text x="736" y="392" class="h">Arquivos originais (ANP)</text>
  <text x="736" y="412" class="t">/var/lib/painel/raw · .csv.gz</text>
  <text x="736" y="430" class="s">SHA-256 em raw.anp_file · ~280 MB</text>

  <!-- Metabase -->
  <rect x="320" y="470" width="380" height="80" rx="10" fill="#fff" stroke="#60a5fa"/>
  <text x="336" y="496" class="h">Metabase</text>
  <text x="336" y="516" class="t">3 dashboards como código (ops/metabase)</text>
  <text x="336" y="534" class="s">lê só a camada marts</text>

  <!-- Runner + backup -->
  <rect x="720" y="470" width="320" height="80" rx="10" fill="#fff" stroke="#60a5fa"/>
  <text x="736" y="496" class="h">GitHub Actions runner</text>
  <text x="736" y="516" class="t">self-hosted (usuário gh-runner)</text>
  <text x="736" y="534" class="s">só push na main; PRs rodam no GitHub</text>
  <rect x="320" y="566" width="720" height="76" rx="10" fill="#fff" stroke="#60a5fa"/>
  <text x="336" y="592" class="h">Backup diário (systemd, fora do Airflow)</text>
  <text x="336" y="612" class="t">pg_dump de airflow + painel + roles, verificado · 7 dias · espelho incremental dos arquivos originais</text>
  <text x="336" y="630" class="s">restauração testada num banco temporário</text>

  <!-- Source edges -->
  <path d="M240 198 L336 225" class="edge"/>
  <path d="M240 286 L336 261" class="edge"/>
  <path d="M240 380 L336 297" class="edge"/>
  <path d="M700 250 L720 230" class="edge"/>
  <path d="M686 412 L720 408" class="edge"/>
  <path d="M510 450 L510 470" class="edge"/>

  <!-- GitHub -->
  <rect x="1100" y="110" width="260" height="170" rx="12" fill="#f8fafc" stroke="#0f172a"/>
  <text x="1120" y="140" class="h">GitHub</text>
  <text x="1120" y="164" class="t">repositório público</text>
  <text x="1120" y="186" class="t">Actions: ruff + pytest</text>
  <text x="1120" y="208" class="t">→ build → GHCR → deploy</text>
  <text x="1120" y="232" class="s">imagem com tag do commit</text>
  <text x="1120" y="250" class="s">rollback: AIRFLOW_IMAGE=&lt;tag&gt;</text>
  <path d="M1100 250 L1040 500" class="edge"/>

  <!-- Telegram -->
  <rect x="1100" y="320" width="260" height="110" rx="12" fill="#fef2f2" stroke="#dc2626"/>
  <text x="1120" y="350" class="h">Telegram</text>
  <text x="1120" y="374" class="t">falha de task (Airflow)</text>
  <text x="1120" y="396" class="t">queda de serviço (Kuma)</text>
  <text x="1120" y="418" class="s">com link para o log</text>
  <path d="M1060 160 L1080 160 L1080 370 L1098 370" class="alert"/>

  <!-- Proxmox host -->
  <rect x="40" y="690" width="1320" height="180" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="720" class="h">Host Proxmox (homelab, sem IP público)</text>
  <rect x="60" y="740" width="420" height="110" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="76" y="766" class="h">LXC uptime-01 · Uptime Kuma</text>
  <text x="76" y="788" class="t">ping da VM · saúde do scheduler (JSON)</text>
  <text x="76" y="808" class="t">push do backup (no máximo a cada 25 h)</text>
  <text x="76" y="830" class="s">fora da VM: avisa mesmo se a VM cair</text>
  <rect x="510" y="740" width="420" height="110" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="526" y="766" class="h">Cópia dos backups</text>
  <text x="526" y="788" class="t">o host puxa via rsync somente leitura (rrsync -ro)</text>
  <text x="526" y="808" class="t">confere SHA-256 · 14 dias · sem --delete</text>
  <text x="526" y="830" class="s">a VM não guarda credencial do host</text>
  <rect x="960" y="740" width="380" height="110" rx="10" fill="#fff" stroke="#94a3b8"/>
  <text x="976" y="766" class="h">VM criada do template cloud-init</text>
  <text x="976" y="788" class="t">Ubuntu 24.04 · início automático no boot</text>
  <text x="976" y="808" class="t">swap de 2 GB como proteção de memória</text>
  <text x="976" y="830" class="s">docs/setup-vm.md</text>
  <path d="M60 795 L26 795 L26 600 L298 600" class="ops"/>
  <path d="M720 740 L720 642" class="ops"/>
  <path d="M420 740 L420 676 L1080 676 L1080 410 L1098 410" class="alert"/>
</svg>
